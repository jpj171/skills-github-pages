<style>
/* ═══════════════════════════════════════
   WCAG AA-compliant color system
   All text/bg combos verified ≥ 4.5:1
   ═══════════════════════════════════════ */
:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-card: #1a2236;
  --bg-card-hover: #212d48;
  --border: #2e3e5c;
  --border-bright: #4a6fa5;
  --text-primary: #edf0f7;
  --text-secondary: #a8b8d4;
  --text-muted: #7f93b5;
  --accent-assertive: #f05a64;
  --accent-moderate: #f4a236;
  --accent-diplomatic: #3dd68c;
  --accent-blue: #5a9fe6;
  --accent-cyan: #22d3ee;
  --npc-supportive: #3dd68c;
  --npc-neutral: #f4a236;
  --npc-agitated: #f05a64;
  --badge-dark: #111318;
  --focus-ring: #22d3ee;
  --font-body: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --transition: 0.25s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body { font-family: var(--font-body); background: #0a0e17; background: var(--bg-primary); color: #edf0f7; color: var(--text-primary); line-height: 1.7; min-height: 100vh; -webkit-font-smoothing: antialiased; }
#app { max-width: 960px; margin: 0 auto; padding: 1.5rem; min-height: 100vh; }
.skip-link { position: absolute; top: -100px; left: 0; background: var(--accent-cyan); color: var(--badge-dark); padding: 0.5rem 1rem; font-weight: 700; z-index: 9999; text-decoration: none; border-radius: 0 0 6px 0; }
.skip-link:focus { top: 0; }
*:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 3px; border-radius: 4px; }
a { color: var(--accent-cyan); text-decoration: underline; }
a:hover { color: #fff; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
#live-announcer { position: absolute; clip: rect(0,0,0,0); height: 1px; width: 1px; overflow: hidden; }
button { font-family: var(--font-body); cursor: pointer; border: none; border-radius: 6px; font-size: 1rem; transition: all var(--transition); }
.btn-primary { background: var(--accent-blue); color: #fff; padding: 0.8rem 2rem; font-weight: 700; font-size: 1rem; }

.badge-assertive { background: var(--accent-assertive); color: #fff; }
.badge-moderate { background: var(--accent-moderate); color: var(--badge-dark); }
.badge-diplomatic { background: var(--accent-diplomatic); color: var(--badge-dark); }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; transition: border-color var(--transition); }
.card:hover { border-color: var(--border-bright); }
.btn-option { width: 100%; text-align: left; background: #1a2236; background: var(--bg-card); border: 2px solid #2e3e5c; border: 2px solid var(--border); color: #edf0f7; color: var(--text-primary); padding: 1.1rem 1.25rem; margin-bottom: 0.75rem; border-radius: 8px; line-height: 1.6; }
.btn-option:hover { border-color: var(--accent-blue); background: var(--bg-card-hover); }
.btn-option[aria-checked="true"] { border-color: var(--accent-cyan); background: rgba(34,211,238,0.07); }
.btn-option .option-label { display: block; font-weight: 700; margin-bottom: 0.4rem; font-size: 1.02rem; color: #edf0f7; color: var(--text-primary); }
.btn-option .option-desc { display: block; color: #a8b8d4; color: var(--text-secondary); font-size: 0.94rem; line-height: 1.6; }
.progress-bar { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
.progress-step { flex: 1; height: 6px; border-radius: 3px; background: var(--border); transition: background var(--transition); }

.screen-header { text-align: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.screen-header h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; color: #edf0f7; color: var(--text-primary); margin-bottom: 0.3rem; }
.screen-header .subtitle { color: #a8b8d4; color: var(--text-secondary); font-size: 0.97rem; }
.situation-box { background: linear-gradient(135deg, var(--bg-card) 0%, rgba(26,34,54,0.85) 100%); border: 1px solid var(--border); border-left: 4px solid var(--accent-blue); border-radius: 8px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; }
.situation-box h3 { font-size: 0.84rem; text-transform: uppercase; letter-spacing: 0.08em; color: #22d3ee; color: var(--accent-cyan); margin-bottom: 0.6rem; }

.tab-btn:hover { border-color: #5a9fe6; border-color: var(--accent-blue); color: #edf0f7; color: var(--text-primary); }
.tab-btn[aria-selected="true"] { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
.npc-panel { margin-top: 1.5rem; padding: 1.25rem; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; }
.npc-panel h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: #7f93b5; color: var(--text-muted); margin-bottom: 1rem; }

.npc-row:last-child { border-bottom: none; }
.npc-flag { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; background: var(--bg-card); border: 2px solid var(--border); overflow: hidden; }

.tracker { margin: 1rem 0; }

.escalation-warning h3 { color: #f05a64; color: var(--accent-assertive); font-size: 1.15rem; margin-bottom: 0.5rem; }
.escalation-warning p { color: #a8b8d4; color: var(--text-secondary); font-size: 0.95rem; line-height: 1.65; }
.btn-blackboard { display: inline-block; background: #3d6bb5; color: #fff; padding: 0.8rem 2rem; font-weight: 700; font-size: 1rem; border-radius: 6px; text-decoration: none; border: 2px solid #3d6bb5; }
.btn-blackboard:hover { background: #4a7cc9; border-color: #4a7cc9; color: #fff; }
.illustration { display: flex; justify-content: center; margin: 1.5rem 0; }
.illustration svg { max-width: 100%; height: auto; }
.round-illo { display: flex; justify-content: center; margin-bottom: 1.5rem; }
.sim-footer { text-align: center; padding: 2rem 0 1rem; color: #7f93b5; color: var(--text-muted); font-size: 0.82rem; border-top: 1px solid #2e3e5c; border-top: 1px solid var(--border); margin-top: 2rem; line-height: 1.7; }
.fade-in { animation: fadeIn 0.35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
@media (forced-colors: active) {
  .btn-option[aria-checked="true"] { border: 3px solid Highlight; }
  .role-card[aria-pressed="true"] { border: 3px solid Highlight; }
  .progress-step.completed, .progress-step.current { background: Highlight; }
  .badge { border: 1px solid currentColor; }
}

function getNpcReactions(pr,round,ch){
const npcs=ROLE_LIST.filter(r=>r!==pr);
const bm={US:{a:'supportive',m:'neutral',d:'agitated'},CN:{a:'agitated',m:'neutral',d:'supportive'},RU:{a:'agitated',m:'neutral',d:'neutral'},FR:{a:'neutral',m:'supportive',d:'neutral'},SG:{a:'neutral',m:'supportive',d:'supportive'}};
const md=JSON.parse(JSON.stringify(bm));
if(pr==='US'&&ch==='a'){md.CN.a='agitated';md.RU.a='agitated';}
if(pr==='US'&&ch==='d'){md.CN.d='supportive';md.SG.d='supportive';}
if(pr==='CN'&&ch==='a'){md.US.a='agitated';md.FR.a='agitated';}
if(pr==='CN'&&ch==='d'){md.US.d='supportive';md.FR.d='supportive';}
if(pr==='RU'&&ch==='a'){md.US.a='agitated';md.FR.a='agitated';}
if(pr==='FR'&&ch==='a'){md.CN.a='agitated';md.RU.a='agitated';}
const Q={US:{supportive:['"We welcome this step toward accountability."','"This is the principled action the Council needs."','"Washington supports this direction."','"We appreciate the commitment to infrastructure protection."'],neutral:['"We are evaluating this carefully."','"We need stronger commitments."','"We reserve judgment."','"We had hoped for more decisive action."'],agitated:['"This fails to address the gravity of the attack."','"Half-measures are unacceptable when our economy was targeted."','"The Council risks irrelevance."','"Washington finds this unacceptable."']},CN:{supportive:['"China is committed to peaceful resolution."','"We appreciate the balanced approach."','"Beijing stands ready to cooperate."','"This reflects sovereign equality."'],neutral:['"We are studying this proposal."','"China has concerns but remains engaged."','"We require further consultation."','"Beijing will participate constructively."'],agitated:['"China categorically rejects these accusations."','"We will not accept attacks on our sovereignty."','"The veto exists for a reason."','"This approach is destabilizing."']},RU:{supportive:['"Russia supports a balanced approach."','"We welcome respect for sovereignty."','"Moscow sees merit here."','"A constructive step."'],neutral:['"Russia is monitoring developments."','"We have scope questions."','"Moscow will clarify its position."','"We neither endorse nor oppose."'],agitated:['"Russia cannot support Western-imposed frameworks."','"A dangerous precedent."','"Moscow will not be pressured."','"We object to politicizing cybersecurity."']},FR:{supportive:['"France believes this is responsible."','"Paris supports this and will contribute."','"Multilateral leadership at its best."','"We commend this contribution."'],neutral:['"France is considering implications."','"We see merits and risks."','"We want more emphasis on long-term norms."','"Ideas for strengthening this."'],agitated:['"This risks fracturing the Council."','"Below international expectations."','"We cannot support undermining institutions."','"We urge reconsideration."']},SG:{supportive:['"We welcome this commitment to de-escalation."','"Consistent with the UN Charter."','"I commend this spirit of cooperation."','"The UN stands ready to support."'],neutral:['"I encourage continued engagement."','"The Secretariat will study this."','"Consider long-term implications."','"We look forward to further discussion."'],agitated:['"I caution against escalatory actions."','"The UN needs cooperative members."','"I urge stepping back."','"This risks undermining the institution."']}};
return npcs.map(nid=>{const mood=md[nid][ch]||'neutral';const ql=Q[nid][mood];return{id:nid,name:ROLES[nid].name,abbr:ROLES[nid].abbr,mood,quote:ql[round%ql.length]};});}

<div className="card" style={{borderLeftColor:choice==='a'?'#f05a64':choice==='m'?'#f4a236':'#3dd68c',borderLeftWidth:'4px'}}>
<div style={{marginBottom:'0.5rem'}}><span className={`badge ${tc[choice]}`}>{tl[choice]}</span></div>
<div style={{fontWeight:700,fontSize:'1.02rem',marginBottom:'0.3rem'}}>{opt.label}</div>
<div style={{color:'#a8b8d4',fontSize:'0.94rem'}}>{opt.desc}</div></div>
<div className="npc-panel" role="region" aria-label="NPC delegation responses"><h3>Delegation Responses</h3>
{npcs.map(n=>(
<div className="npc-row" key={n.id}>
<div className="npc-flag" aria-hidden="true"><RoleIcon roleId={n.id}/></div>
<div className="npc-info"><div className="npc-name">{n.name} <span className={`npc-mood mood-${n.mood}`} aria-label={`Mood: ${n.mood}`}>{n.mood==='supportive'?'● Supportive':n.mood==='neutral'?'● Cautious':'● Agitated'}</span></div><div className="npc-quote">{n.quote}</div></div>
</div>))}</div>
<div style={{textAlign:'center',marginTop:'1.5rem'}}><button className="btn-primary" onClick={onContinue}>{round<totalRounds-1?'Continue to Next Round':'View Results'}</button></div>
</main>);}

function DecisionTracker({role,choices}){
const tl={a:'Assertive',m:'Moderate',d:'Diplomatic'};const tc={a:'badge-assertive',m:'badge-moderate',d:'badge-diplomatic'};
return(<div style={{marginTop:'1.5rem'}} role="region" aria-label="Decision path tracker"><h3 style={{fontSize:'0.85rem',textTransform:'uppercase',letterSpacing:'0.08em',color:'#7f93b5',marginBottom:'1rem'}}>Your Decision Path</h3><div className="tracker">{choices.map((c,i)=>{const o=GD[role].rounds[i].options.find(x=>x.id===c);return(<div className="tracker-round" key={i}><div className="tracker-round-num" aria-hidden="true">{i+1}</div><div className="tracker-content"><div className="tracker-choice"><span className={`badge ${tc[c]}`} style={{marginRight:'0.5rem'}}>{tl[c]}</span>{o.label}</div><div className="tracker-desc">Round {i+1}: {ROUND_TITLES[i]}</div></div></div>);})}</div></div>);}

function EscalationScreen({role,choices,onRestart}){
const h=useFocusOnMount();
useEffect(()=>{announce('Crisis escalation. Simulation ended early.');},[]);
const narr={US:'The U.S. launched retaliatory cyber operations, triggering escalation the Council cannot contain. Military forces are on high alert.',CN:'China\'s categorical rejection convinced Washington diplomacy has failed. The U.S. is preparing unilateral action.',RU:'Russia\'s obstruction fragmented the Council. The U.S. and China now confront each other without multilateral moderation.',FR:'France\'s aggressive stance alienated China and Russia, collapsing diplomatic space for compromise.',SG:'Your assertive framing was seen as taking sides, undermining credibility. Both parties lost confidence in the UN process.'};
return(<main className="fade-in" id="main-content">
<div className="screen-header"><h1 ref={h} tabIndex="-1" style={{outline:'none'}}>Crisis Escalation</h1><p className="subtitle">The situation has spiraled beyond control</p></div>
<div className="escalation-warning" role="alert"><h3>⚠ Simulation Terminated Early</h3><p>Your consistently assertive approach pushed the crisis past diplomatic recovery. {narr[role]}</p></div>
<div className="situation-box"><h3>Lessons</h3><p>In multilateral negotiations involving nuclear-armed powers with veto authority, consistently assertive approaches can foreclose diplomatic options. The UNSC's design requires consensus-building, especially when the parties to a dispute are permanent members.</p></div>
<DecisionTracker role={role} choices={choices}/>
<div style={{textAlign:'center',marginTop:'1.5rem',display:'flex',flexWrap:'wrap',gap:'1rem',justifyContent:'center'}}><button className="btn-primary" onClick={onRestart}>Try Again</button><a href="https://learn.ksu.edu" className="btn-blackboard" target="_blank" rel="noopener noreferrer">Proceed to Blackboard</a></div>
<footer className="sim-footer">Based on CFR Education materials · Council on Foreign Relations<br/>For educational use · No personal data collected</footer>
</main>);}

function ResultsScreen({role,choices,onRestart}){
const a=choices.filter(c=>c==='a').length,m=choices.filter(c=>c==='m').length,d=choices.filter(c=>c==='d').length;
const h=useFocusOnMount();
useEffect(()=>{announce('Simulation complete. Review your results.');},[]);
let title,desc;
if(d>=3){title='Consensus Achieved';desc='Your diplomatic approach built consensus. A presidential statement — or even a resolution — reflects shared commitment to de-escalation. While it may lack teeth, the process has de-escalated the crisis and opened negotiation channels.';}
else if(m>=2&&a<=1){title='Pragmatic Progress';desc='Your balanced approach navigated the veto minefield. The Council adopted a resolution establishing a cybersecurity committee and calling for restraint — imperfect, but real.';}
else if(a>=2&&d>=1){title='Principled Stand with Compromise';desc='You pushed hard for accountability while showing flexibility. The result is stronger than many expected, though it required concessions. One or more P5 members abstained.';}
else if(m>=2){title='Middle Ground';desc='The Council adopted a measured response. It doesn\'t fully satisfy anyone, but it keeps institutional machinery working and avoids worst outcomes.';}
else{title='Divided Council';desc='Your mixed approach reflected complexity but made coalition-building harder. The Council managed a presidential statement, but binding action proved elusive. The crisis remains unresolved, though escalation was avoided — for now.';}
return(<main className="fade-in" id="main-content">
<div className="screen-header"><div style={{fontSize:'0.78rem',textTransform:'uppercase',letterSpacing:'0.1em',color:'#22d3ee',marginBottom:'0.3rem'}}>Simulation Complete</div><h1 ref={h} tabIndex="-1" style={{outline:'none'}}>{title}</h1><p className="subtitle">Playing as: {ROLES[role].name}</p></div>
<div className="situation-box"><h3>Outcome</h3><p>{desc}</p></div>
<div className="card" role="region" aria-label="Decision profile"><h3 style={{fontSize:'0.85rem',textTransform:'uppercase',letterSpacing:'0.08em',color:'#7f93b5',marginBottom:'1rem'}}>Decision Profile</h3><div style={{display:'flex',gap:'1.5rem',flexWrap:'wrap'}}><div><span className="badge badge-assertive" style={{marginRight:'0.4rem'}}>Assertive</span><span style={{fontWeight:700}}>{a}</span></div><div><span className="badge badge-moderate" style={{marginRight:'0.4rem'}}>Moderate</span><span style={{fontWeight:700}}>{m}</span></div><div><span className="badge badge-diplomatic" style={{marginRight:'0.4rem'}}>Diplomatic</span><span style={{fontWeight:700}}>{d}</span></div></div></div>
<DecisionTracker role={role} choices={choices}/>
<div className="situation-box" style={{marginTop:'1.5rem',borderLeftColor:'#f4a236'}}><h3>Reflection Questions</h3><p style={{marginBottom:'0.5rem'}}>Consider these as you prepare your written reflection:</p><ul style={{paddingLeft:'1.25rem',color:'#a8b8d4',fontSize:'0.95rem',lineHeight:1.8}}><li>Which interests did you prioritize, and what did you sacrifice?</li><li>How did the veto dynamic constrain your options?</li><li>Would a different role have led to different decisions?</li><li>What does this reveal about governing cyberspace through multilateral institutions?</li><li>If you replayed the simulation, what would you do differently?</li></ul></div>
<div style={{textAlign:'center',marginTop:'1.5rem',display:'flex',flexWrap:'wrap',gap:'1rem',justifyContent:'center'}}><button className="btn-primary" onClick={onRestart}>Play Again</button><a href="https://learn.ksu.edu" className="btn-blackboard" target="_blank" rel="noopener noreferrer">Proceed to Blackboard</a></div>
<footer className="sim-footer">Based on CFR Education materials · Council on Foreign Relations<br/>For educational use · No personal data collected</footer>
</main>);}

/* ═══ APP ═══ */
function App(){
const T=4;const[scr,setScr]=useState('title');const[role,setRole]=useState(null);const[rnd,setRnd]=useState(0);const[ch,setCh]=useState([]);const[cc,setCc]=useState(null);
const go=useCallback(s=>{setScr(s);window.scrollTo({top:0,behavior:'smooth'});},[]);
const reset=()=>{setRole(null);setRnd(0);setCh([]);setCc(null);go('title');};
return(<div>
{scr==='title'&&<TitleScreen onStart={()=>go('roleSelect')}/>}
{scr==='roleSelect'&&<RoleSelectScreen onSelect={r=>{setRole(r);setRnd(0);setCh([]);go('briefing');}}/>}
{scr==='briefing'&&<BriefingScreen role={role} round={rnd} totalRounds={T} onContinue={()=>go('decision')}/>}
{scr==='decision'&&<DecisionScreen role={role} round={rnd} totalRounds={T} onDecide={c=>{setCc(c);const nc=[...ch,c];setCh(nc);if(nc.filter(x=>x==='a').length>=3&&rnd<T-1){go('escalation');return;}go('outcome');}}/>}
{scr==='outcome'&&<OutcomeScreen role={role} round={rnd} totalRounds={T} choice={cc} onContinue={()=>{if(rnd>=T-1){go('results');}else{setRnd(r=>r+1);go('briefing');}}}/>}
{scr==='results'&&<ResultsScreen role={role} choices={ch} onRestart={reset}/>}
{scr==='escalation'&&<EscalationScreen role={role} choices={ch} onRestart={reset}/>}
</div>);}

ReactDOM.render(<App/>,document.getElementById('app'));
</script>
</body>
</html>
